  bucketName: uploads
  publicUrl: http://localhost:19000
jwt:
  secret-key: "${JWT_SECRET:mHHExurkoTWNSHdp3so1yj3zOz+mzd85xO1jryQe7SM=}"

# 管理员账号初始化配置
admin:
  username: admin
  password: admin123
  primary-org: default
